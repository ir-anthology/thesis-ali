name: Publish Backend Image to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'sparql/option-4-rule-based-sparql-generation/backend/**'
      - 'sparql/option-4-rule-based-sparql-generation/data/**'
      - 'sparql/option-4-rule-based-sparql-generation/Dockerfile'
      - 'sparql/option-4-rule-based-sparql-generation/pyproject.toml'
      - 'sparql/option-4-rule-based-sparql-generation/uv.lock'
      - '.github/workflows/publish-backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image
  cancel-in-progress: true

env:
  IMAGE_NAME: muhammadfarzadali/ir-anthology-chat-api
  BUILD_CONTEXT: sparql/option-4-rule-based-sparql-generation

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    env:
      # The test suite is fully mocked/offline; the OpenAI SDK only refuses to
      # construct a client when no key is set, so a placeholder is enough.
      OPENAI_API_KEY: dummy-key-for-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          # Match the interpreter used by the Dockerfile.
          python-version: '3.11'
          enable-cache: true

      - name: Run tests
        working-directory: ${{ env.BUILD_CONTEXT }}
        run: uv run --frozen --extra dev pytest -q

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BUILD_CONTEXT }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
