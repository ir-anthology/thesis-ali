name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/adaptive/**'
      - '.github/workflows/deploy-frontend.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/adaptive/package-lock.json

      - name: Install dependencies
        working-directory: frontend/adaptive
        run: npm ci

      - name: Build
        working-directory: frontend/adaptive
        run: npm run build
        env:
          BASE_PATH: /thesis-ali
          VITE_API_BASE: https://ir-anthology-chat-api.web.webis.de

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/adaptive/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
