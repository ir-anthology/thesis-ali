apiVersion: v1
kind: ConfigMap
metadata:
  name: ir-anthology-chat-api-config
  namespace: webisstud
data:
  OPENAI_API_KEY: "<REPLACE_WITH_ACTUAL_KEY>"
  LLM_MODEL: "gpt-5.6-luna"
  LLM_TEMPERATURE: "0.0"
  LLM_MAX_TOKENS: "2000"
  DBLP_SPARQL_ENDPOINT: "https://database-ir-anthology.srv.webis.de/"
  MAX_RESULT_ROWS: "50"
  QUESTION_BATCH_SIZE: "10"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RELOAD: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
spec:
  selector:
    matchLabels:
      app: ir-anthology-chat-api
  replicas: 1
  template:
    metadata:
      labels:
        app: ir-anthology-chat-api
    spec:
      containers:
        - name: ir-anthology-chat-api
          image: muhammadfarzadali/ir-anthology-chat-api:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ir-anthology-chat-api-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
spec:
  type: ClusterIP
  selector:
    app: ir-anthology-chat-api
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: "nginx-external"
  rules:
    - host: ir-anthology-chat-api.web.webis.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ir-anthology-chat-api
                port:
                  number: 8000
