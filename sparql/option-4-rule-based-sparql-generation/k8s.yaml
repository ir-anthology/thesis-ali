apiVersion: v1
kind: ConfigMap
metadata:
  name: ir-anthology-chat-api-config
  namespace: webisstud
data:
  OPENAI_API_KEY: "your-api-key-here"
  LLM_MODEL: "gpt-5.6-luna"
  LLM_TEMPERATURE: "0.0"
  LLM_MAX_TOKENS: "2000"
  DBLP_SPARQL_ENDPOINT: "https://database-ir-anthology.srv.webis.de/"
  QUESTION_BATCH_SIZE: "10"
  ANALYTICS_DB_PATH: "/data/analytics.sqlite3"
  # Empty means indefinite retention until an approved policy sets a number.
  ANALYTICS_RETENTION_DAYS: ""
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  RELOAD: "false"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
spec:
  selector:
    matchLabels:
      app: ir-anthology-chat-api
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ir-anthology-chat-api
    spec:
      containers:
        - name: ir-anthology-chat-api
          image: muhammadfarzadali/ir-anthology-chat-api:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ir-anthology-chat-api-config
          volumeMounts:
            - name: analytics-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: analytics-data
          persistentVolumeClaim:
            claimName: ir-anthology-chat-api-analytics

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ir-anthology-chat-api-analytics
  namespace: webisstud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
spec:
  type: ClusterIP
  selector:
    app: ir-anthology-chat-api
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ir-anthology-chat-api
  namespace: webisstud
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: "nginx-external"
  rules:
    - host: ir-anthology-chat-api.web.webis.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ir-anthology-chat-api
                port:
                  number: 8000
